  function sectionHtml(k, sec, isCanape, idx){
    const cfg = MCFG[k]; const dishes = (mdoc(k)||{}).dishes || [];
    const dis = S.readOnly ? 'disabled' : '';
    const mine = dishes.filter(d=>d[cfg.secKey]===sec);
    const cnt = t => mine.filter(d=>d.tag===t).length;
    const key = `${k}:${sec}`;
    const chips = [['yes','Yes'],['maybe','Maybe'],['no','No']].filter(([t])=>cnt(t)).map(([t,l])=>`<span class="mchip ${t}">${cnt(t)} ${l.toLowerCase()}</span>`).join('');
    let h = `<details class="drop pal-${idx%5}" data-dkey="${esc(key)}" ${S.menuEdit||isOpen(key)?'open':''}>
      <summary><span class="dname">${esc(sec)}</span><span class="dmeta">${mine.length} dish${mine.length===1?'':'es'}</span><span class="dchips">${chips}</span></summary><div class="drop-body">`;
    if(S.menuEdit){
      h += `<div class="sec-edit"><input type="text" class="sec-name" data-secname="${k}" data-old="${esc(sec)}" value="${esc(sec)}" aria-label="Section name" ${dis}>
        <button class="btn danger" data-secdel="${k}" data-sec="${esc(sec)}">Delete section</button></div>`;
    }
    h += `<div class="courses">`;
    cfg.subs.forEach(sub=>{
      const ds = dishes.map((d,i)=>[d,i]).filter(([d])=>d[cfg.secKey]===sec && d[cfg.subKey]===sub);
      if(!ds.length && !S.menuEdit) return;
      h += `<div><h3>${sub}</h3>${ds.map(([d,i])=>dishHtml(k,i,d)).join('')}
        ${S.menuEdit?`<button class="add" data-dadd="${k}" data-sec="${esc(sec)}" data-sub="${sub}">Add dish</button>`:''}</div>`;
    });
    return h + `</div></div></details>`;
  }
  function renderMenu(){
    if(!S.ready.menu) return '<p class="empty">Loading...</p>';
    const dis = S.readOnly ? 'disabled' : '';
    let h = `<div class="toolbar"><p class="legend" style="margin:0">${S.menuEdit?'Edit dish names and descriptions, or add and remove dishes. Changes save as you go.':'Mark each dish Yes, Maybe or No. Tap again to clear it.'}</p>
      ${S.readOnly?'':`<button class="btn ${S.menuEdit?'':'ghost'}" data-menuedit>${S.menuEdit?'Done editing':'Edit menu'}</button>`}</div>`;
    sectionsOf('sets').forEach((sec,i)=>{ h += sectionHtml('sets', sec, false, i); });
    if(S.menuEdit) h += `<button class="add" data-secadd="sets">${MCFG.sets.addLabel}</button>`;
    const can = S.canapes || {};
    h += `<section class="menu-tier" style="margin-top:30px"><h2>Canapés</h2>`;
    h += S.menuEdit
      ? `<label class="pkg">Package details<input type="text" data-pkg value="${esc(can.package)}" ${dis}></label>`
      : (can.package ? `<p class="legend">${esc(can.package)}</p>` : '');
    h += `</section>`;
    sectionsOf('canapes').forEach((sec,i)=>{ h += sectionHtml('canapes', sec, true, i+2); });
    if(S.menuEdit) h += `<button class="add" data-secadd="canapes">${MCFG.canapes.addLabel}</button>`;
    return h;
  }
  function menuClick(t){
    if(t.closest('[data-menuedit]')){ S.menuEdit=!S.menuEdit; render(); return true; }
    const pk = t.closest('[data-pick]');
    if(pk){ const [k,i,v]=pk.dataset.pick.split(':'); const doc=mdoc(k); if(!doc) return true;
      const dishes = doc.dishes.map(x=>({...x})); dishes[+i].tag = dishes[+i].tag===v ? '' : v;
      saveMenu(k, dishes, sectionsOf(k)); render(); return true; }
    const dd = t.closest('[data-ddel]');
    if(dd){ const [k,i]=dd.dataset.ddel.split(':'); const doc=mdoc(k); const d=doc.dishes[+i];
      if(confirm(`Remove "${d.name||'this dish'}"?`)){ const secs=sectionsOf(k); saveMenu(k, doc.dishes.filter((_,j)=>j!==+i).map(x=>({...x})), secs); render(); } return true; }
    const da = t.closest('[data-dadd]');
    if(da){ const k=da.dataset.dadd, cfg=MCFG[k]; const doc=mdoc(k)||{dishes:[]};
      const secs=sectionsOf(k); const dishes=(doc.dishes||[]).map(x=>({...x}));
      dishes.push({[cfg.secKey]:da.dataset.sec,[cfg.subKey]:da.dataset.sub,name:'',desc:'',tag:''});
      saveMenu(k, dishes, secs); render();
      const inputs = view.querySelectorAll(`[data-dish="${k}:${dishes.length-1}"] input`); if(inputs[0]) inputs[0].focus();
      return true; }
    const sd = t.closest('[data-secdel]');
    if(sd){ const k=sd.dataset.secdel, cfg=MCFG[k], sec=sd.dataset.sec; const doc=mdoc(k)||{dishes:[]};
      if(confirm(`Delete "${sec}" and all its dishes?`)){ saveMenu(k, doc.dishes.filter(d=>d[cfg.secKey]!==sec).map(x=>({...x})), sectionsOf(k).filter(s=>s!==sec)); render(); } return true; }
    const sa = t.closest('[data-secadd]');
    if(sa){ const k=sa.dataset.secadd; const name=prompt(k==='sets'?'Name of the menu option, for example "£120 menu"':'Name of the canapé section');
      if(name && name.trim()){ const secs=sectionsOf(k); if(!secs.includes(name.trim())){ saveMenu(k, ((mdoc(k)||{}).dishes||[]).map(x=>({...x})), [...secs, name.trim()]); render(); } } return true; }
    return false;
  }
  function menuChange(t){
    const row = t.closest('[data-dish]');
    if(row && t.dataset.df){ const [k,i]=row.dataset.dish.split(':'); const doc=mdoc(k); if(!doc) return true;
      const dishes = doc.dishes.map(x=>({...x})); dishes[+i][t.dataset.df] = t.value.trim();
      saveMenu(k, dishes, sectionsOf(k)); pending=true; return true; }
    if(t.dataset.secname){ const k=t.dataset.secname, cfg=MCFG[k], old=t.dataset.old, nv=t.value.trim();
      if(!nv || nv===old){ t.value=old; return true; }
      const secs = sectionsOf(k); if(secs.includes(nv)){ status('There is already a section with that name'); t.value=old; return true; }
      const dishes = (mdoc(k).dishes||[]).map(d=>d[cfg.secKey]===old?{...d,[cfg.secKey]:nv}:{...d});
      saveMenu(k, dishes, secs.map(s=>s===old?nv:s)); t.dataset.old=nv; pending=true; return true; }
    if('pkg' in t.dataset){ const doc=S.canapes||{dishes:[]}; saveMenu('canapes', (doc.dishes||[]).map(x=>({...x})), sectionsOf('canapes'), {package:t.value.trim()}); pending=true; return true; }
    return false;
  }

  /* ---------- savings ---------- */
  function renderSavings(){
    if(!S.ready.savings || !S.ready.settings) return '<p class="empty">Loading...</p>';
    const rows = [...S.savings].sort((a,b)=>n(a.order)-n(b.order));
    const sum = k => rows.reduce((s,r)=>s+n(r[k]),0);
    const goal = n(S.settings.goalEach);
    const m = sum('p1'), y = sum('p2'), g = sum('gifts'), im = sum('idealP1'), iy = sum('idealP2');
    const dis = S.readOnly?'disabled':'';
    const now = today().slice(0,7);
    const bar = (label, v) => `<div class="goal-row"><div>${label}</div><div class="goal-track"><span style="width:${Math.min(goal? v/goal*100:0,100).toFixed(1)}%"></span></div><div class="num">${money(v)} <span style="color:var(--muted)">(${money(Math.max(goal-v,0))} to go)</span></div></div>`;

    // status for each person's cell and for the month as a whole
    const cellState = (r, who) => {
      const ideal = n(r['ideal'+who]), act = r[who.toLowerCase()];
      const when = (r.month||'') < now ? 'past' : (r.month||'') === now ? 'now' : 'future';
      if(has(act)) return ideal && act < ideal ? 'missed' : 'hit';
      if(ideal > 0) return when==='past' ? 'missing' : when==='now' ? 'due' : 'future';
      return when==='future' ? 'future' : 'none';
    };
    const monthState = r => {
      const a = cellState(r,'P1'), b = cellState(r,'P2');
      const when = (r.month||'') < now ? 'past' : (r.month||'') === now ? 'now' : 'future';
      if(a==='missing' || b==='missing') return {k:'missing', t:'Not filled in'};
      if(when==='future') return {k:'future', t:'Upcoming'};
      if(a==='due' || b==='due') return {k:'due', t:'Due this month'};
      if(a==='missed' || b==='missed'){
        const short = Math.max(n(r.idealP1)+n(r.idealP2) - n(r.p1) - n(r.p2), 0);
        return short>0 ? {k:'missed', t:`Short by ${money(short)}`} : {k:'hit', t:'Hit overall'};
      }
      if(a==='none' && b==='none') return {k:'none', t:n(r.gifts)?'Gifts only':'No plan'};
      const extra = n(r.p1)+n(r.p2) - n(r.idealP1) - n(r.idealP2);
      return {k:'hit', t: extra>0 ? `Hit, ${money(extra)} extra` : 'Hit'};
    };

    // plan so far (months up to this one that have been filled in or are past)
    let planSoFar=0, actualSoFar=0, planLeft=0, missing=0;
    rows.forEach(r=>{
      const ideal = n(r.idealP1)+n(r.idealP2), act = n(r.p1)+n(r.p2);
      const filled = has(r.p1) || has(r.p2);
      if((r.month||'') < now || ((r.month||'')===now && filled)){ planSoFar += ideal; actualSoFar += act; if(monthState(r).k==='missing') missing++; }
      else planLeft += ideal;
    });
    const diff = actualSoFar - planSoFar;
    const projected = m + y + g + planLeft;
    const budgetTotal = S.ready.budget ? budgetTotals(S.budget).est : 0;

    let h = `<div class="summary six num">
        <div><small>Our savings</small><b>${money(m+y)}</b></div>
        <div><small>Gifts</small><b>${money(g)}</b></div>
        <div><small>Overall</small><b>${money(m+y+g)}</b><div class="note">Our savings plus gifts</div></div>
        <div><small>Ideal plan overall</small><b>${money(im+iy)}</b></div>
        <div class="hl"><small>Ideal plan plus gifts</small><b>${money(im+iy+g)}</b><div class="note">What you'd have if every month hit the plan</div></div>
        <div class="${diff<0?'sv-bad':'sv-good'}"><small>Against the plan so far</small><b>${diff<0?money(-diff)+' behind':money(diff)+' ahead'}</b><div class="note">${money(actualSoFar)} saved vs ${money(planSoFar)} planned${missing?`, ${missing} month${missing>1?'s':''} not filled in`:''}</div></div>
      </div>
      <p class="sv-proj">If you stick to the plan from here, you'll end up with <b class="num">${money(projected)}</b> including gifts${budgetTotal?`, against our share of the wedding cost of <b class="num">${money(budgetTotal)}</b>. ${projected>=budgetTotal?`That leaves <b class="num sv-good-t">${money(projected-budgetTotal)}</b> spare.`:`That's <b class="num sv-bad-t">${money(budgetTotal-projected)}</b> short.`}`:'.'}</p>
      <div class="inline-set"><label>Goal each<input inputmode="decimal" data-setting="goalEach" value="${goal.toFixed(2)}" ${dis}></label></div>
      <div class="goal">${bar('Partner 1', m)}${bar('Partner 2', y)}</div>
      <div class="sv-key"><span class="st hit">Hit the plan</span><span class="st missed">Short of the plan</span><span class="st missing">Month passed, not filled in</span><span class="st due">Due this month</span><span class="st future">Upcoming</span></div>`;
    const head = `<thead><tr><th>Pay month</th><th class="r">Partner 1</th><th class="r">Partner 2</th><th class="r">Gifts</th><th class="r">Ideal Partner 1</th><th class="r">Ideal Partner 2</th><th>Status</th></tr></thead>`;
    const cell = (r,k,cls) => `<td class="r ${cls||''}"><input class="money" inputmode="decimal" data-sf="${k}" value="${has(r[k])?r[k].toFixed(2):''}" ${dis} aria-label="${esc(r.label)} ${k}"></td>`;
    const rowHtml = r => { const st = monthState(r);
      return `<tr data-sav="${esc(r.id)}" class="sv-row sv-${st.k}"><td>${esc(r.label)}</td>${cell(r,'p1','c-'+cellState(r,'P1'))}${cell(r,'p2','c-'+cellState(r,'P2'))}${cell(r,'gifts', n(r.gifts)?'c-gift':'')}${cell(r,'idealP1')}${cell(r,'idealP2')}<td><span class="st ${st.k}">${esc(st.t)}</span></td></tr>`; };
    const table = list => `<div class="tablewrap"><table class="grid num savings">${head}<tbody>${list.map(rowHtml).join('')}</tbody></table></div>`;
    const past = rows.filter(r=>(r.month||'') < now), cur = rows.filter(r=>(r.month||'') === now), fut = rows.filter(r=>(r.month||'') > now);
    const cnt = (list, k) => list.filter(r=>monthState(r).k===k).length;
    const chip = (k, num, label) => num ? `<span class="st ${k}">${num} ${label}</span>` : '';
    const savedIn = list => list.reduce((s,r)=>s+n(r.p1)+n(r.p2),0);
    const planIn = list => list.reduce((s,r)=>s+n(r.idealP1)+n(r.idealP2),0);

    if(past.length){
      const miss = cnt(past,'missing');
      h += `<details class="drop pal-1" data-dkey="savings:past" ${isOpen('savings:past')?'open':''}>
        <summary><span class="dname">Previous months</span><span class="dmeta">${past.length} month${past.length===1?'':'s'}, ${money(savedIn(past))} saved</span>
        <span class="dchips">${chip('hit',cnt(past,'hit'),'hit')}${chip('missed',cnt(past,'missed'),'short')}${chip('missing',miss,'not filled in')}</span></summary>
        <div class="drop-body">${table(past)}</div></details>`;
    }
    if(cur.length){
      const st = monthState(cur[0]);
      h += `<details class="drop pal-3 now" data-dinv="savings:now-shut" ${isOpen('savings:now-shut')?'':'open'}>
        <summary><span class="dname">This month</span><span class="dmeta">${esc(cur.map(r=>r.label).join(', '))}, plan ${money(planIn(cur))}</span><span class="dchips"><span class="st ${st.k}">${esc(st.t)}</span></span></summary>
        <div class="drop-body">${table(cur)}</div></details>`;
    }
    if(fut.length){
      h += `<details class="drop pal-4" data-dkey="savings:future" ${isOpen('savings:future')?'open':''}>
        <summary><span class="dname">Coming up</span><span class="dmeta">${fut.length} month${fut.length===1?'':'s'}, next is ${esc(fut[0].label)}</span><span class="damt num">${money(planIn(fut))} planned</span></summary>
        <div class="drop-body">${table(fut)}</div></details>`;
    }
    h += `<div class="tablewrap"><table class="grid num savings sv-total-t"><tbody><tr class="sv-tot"><td><b>Total</b></td><td class="r"><b>${money(m)}</b></td><td class="r"><b>${money(y)}</b></td><td class="r"><b>${money(g)}</b></td><td class="r"><b>${money(im)}</b></td><td class="r"><b>${money(iy)}</b></td><td></td></tr></tbody></table></div>
      ${S.readOnly?'':'<button class="add" data-sadd>Add a month</button>'}`;
    return h;
  }

  /* ---------- main render ---------- */
  function render(){
    renderHeader();
    document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)));
    if(!db){ renderJump(); view.innerHTML = `<div class="notice">Saving is not available in this browser.</div>`; return; }
    const y = window.scrollY;
    view.innerHTML = S.tab==='budget'?renderBudget():S.tab==='venue'?renderVenue():S.tab==='menu'?renderMenu():S.tab==='backup'?renderBackup():renderSavings();
    renderJump();
    window.scrollTo(0,y);
  }

  /* ---------- events ---------- */
  document.querySelector('nav.tabs').addEventListener('click', e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; S.tab=b.dataset.tab; pending=false; render(); if(S.tab==='backup') loadBackups(); const st=document.getElementById('sticky'); const top=st.offsetTop; if(window.scrollY>top) window.scrollTo(0,top); });

  view.addEventListener('toggle', e=>{ const d=e.target; if(d.tagName!=='DETAILS' || S.menuEdit) return; if(d.dataset.dkey){ dropOpen(d.dataset.dkey, d.open); if(!d.open && d.dataset.dkey.startsWith('cat:')){ const c=d.dataset.dkey.slice(4); if(S.budget.some(r=>(r.category||'Other')===c && (r.id===S.open || r.id===S.flash))){ S.open=null; S.flash=null; } } } else if(d.dataset.dinv) dropOpen(d.dataset.dinv, !d.open); }, true);
  $('#jump').addEventListener('click', e=>{ const b=e.target.closest('[data-jump]'); if(b) jumpTo(b.dataset.jump); });

  view.addEventListener('input', e=>{
    const t0 = e.target;
    if(t0.dataset.nf && S.newItem){ S.newItem[t0.dataset.nf] = t0.value; return; }
  });
  view.addEventListener('input', e=>{
    const t = e.target; if(!t.dataset.pf) return;
    const f = t.closest('[data-payform]'); if(!f) return;
    const key = f.dataset.payform;
    const d = draft(key, S.budget.find(x=>x.id===key));
    if(t.type==='radio'){ if(t.checked) d.kind = t.value; } else d[t.dataset.pf] = t.value;
    if(t.dataset.pf==='item'){ const it=S.budget.find(x=>x.id===t.value); if(it){ d.source=srcOf(it.fundedBy); const sel=f.querySelector('[data-pf="source"]'); if(sel) sel.value=d.source; } }
    const pv = f.querySelector('[data-preview]'); if(pv) pv.innerHTML = previewText(key, key==='global'?null:S.budget.find(x=>x.id===key));
  });
  view.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.dataset.nf && e.target.tagName!=='SELECT'){ e.preventDefault(); e.target.blur(); saveNewItem(); return; }
    if(e.key==='Escape' && e.target.dataset.nf){ S.newItem=null; render(); return; }
    if(e.key!=='Enter' || !e.target.dataset.pf || e.target.tagName==='SELECT') return;
    const f = e.target.closest('[data-payform]'); if(!f) return;
    e.preventDefault(); e.target.blur(); confirmPay(f.dataset.payform);
  });

  view.addEventListener('click', e=>{
    const t = e.target;
    const jb = t.closest('[data-jump]');
    if(jb){ jumpTo(jb.dataset.jump); return; }
    const vw = t.closest('[data-view]');
    if(vw){ S.view = vw.dataset.view==='us'?'us':'all'; try{ localStorage.setItem('wb-view', S.view); }catch(e){} render(); return; }
    if(t.closest('[data-globalpay]')){ S.globalPay=!S.globalPay; render(); return; }
    const pc = t.closest('[data-payconfirm]');
    if(pc){ confirmPay(pc.dataset.payconfirm); return; }
    const pd = t.closest('[data-paydel]');
    if(pd){ const [rid,pid]=pd.dataset.paydel.split(':'); removePay(rid,pid); return; }
    const dl = t.closest('[data-dl]');
    if(dl){ const stamp=today(); if(dl.dataset.dl==='csv') offerDownload(`wedding-budget-${stamp}.csv`, budgetCsv()); else offerDownload(`wedding-budget-backup-${stamp}.json`, JSON.stringify(snapshotBody(), null, 2)); return; }
    if(t.closest('[data-snapnow]')){ saveSnapshot('m'+Date.now()).then(ok=>{ status(ok?'Copy saved':'Could not save a copy'); loadBackups(); }); return; }
    const rs = t.closest('[data-restore]');
    if(rs){ const b=(S.backups||[]).find(x=>x.id===rs.dataset.restore);
      if(b && confirm('Replace everything in the budget with this copy? Your current version is saved first, so you can undo this.')){
        db.doc('backups/'+b.id).get().then(snap=>restoreFrom(snap.data())).catch(()=>status('Could not load that copy')); }
      return; }
    const fl = t.closest('[data-filter]');
    if(fl){ S.filter=fl.dataset.filter; render(); return; }
    const dn = t.closest('[data-done]');
    if(dn){ const r=S.budget.find(x=>x.id===dn.dataset.done); if(r){ r.finalPaid=!r.finalPaid; render(); upd('budget/'+r.id,{finalPaid:r.finalPaid}); } return; }
    const open = t.closest('[data-open]');
    if(open){ const id=open.dataset.open; S.open = S.open===id?null:id; render(); return; }
    const add = t.closest('[data-add]');
    if(add){ startNewItem(add.dataset.add); return; }
    if(t.closest('[data-newcat]')){ const name = prompt('Name of the new category'); if(name && name.trim()) startNewItem(name.trim()); return; }
    if(t.closest('[data-newcancel]')){ S.newItem=null; render(); return; }
    if(t.closest('[data-newsave]')){ saveNewItem(); return; }
    const d = t.closest('[data-del]');
    const fi = t.closest('[data-finish]');
    if(fi){ const r=S.budget.find(x=>x.id===fi.dataset.finish); if(!r) return;
      const left = Math.max(n(r.estimate)-n(r.cost),0);
      const msg = n(r.cost)>0
        ? `Mark "${r.item}" as finished? You spent ${money(r.cost)} and expected ${money(r.estimate)}.${left?` The ${money(left)} left over will count as saved and won't show as money to spend.`:''} You can reopen it later.`
        : `Mark "${r.item}" as not needed?${left?` Its ${money(left)} budget will count as saved and won't show as money to spend.`:''} You can reopen it later.`;
      if(confirm(msg)){ const patch={closed:true, finalPaid:true}; Object.assign(r,patch); upd('budget/'+r.id, patch); S.open=null; flashRow(r.id); status(n(r.cost)>0?'Marked as finished':'Marked as not needed'); }
      return; }
    const ro = t.closest('[data-reopen]');
    if(ro){ const r=S.budget.find(x=>x.id===ro.dataset.reopen); if(r){ r.closed=false; upd('budget/'+r.id,{closed:false}); render(); status('Reopened'); } return; }
    if(d){ const r=S.budget.find(x=>x.id===d.dataset.del); if(r && confirm(`Delete "${r.item||'this item'}"?`)){ S.open=null; del('budget/'+r.id); } return; }
    const vd = t.closest('[data-vdel]');
    if(vd){ const v=S.venue.find(x=>x.id===vd.dataset.vdel); if(v && confirm(`Remove "${v.name}"?`)) del('venue/'+v.id); return; }
    const va = t.closest('[data-vadd]');
    if(va){ addVenueItem(va.dataset.vadd||'Other'); return; }
    if(t.closest('[data-vsecadd]')){ const name=prompt('Name of the new section, for example "Extras"'); if(name && name.trim()) addVenueItem(name.trim()); return; }
    if(t.closest('[data-sadd]')){ addMonth(); return; }
    if(menuClick(t)) return;
  });

  view.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.nf){ if(S.newItem) S.newItem[t.dataset.nf] = t.value; return; }
    if(t.dataset.pf){
      const f = t.closest('[data-payform]');
      if(f){ const key=f.dataset.payform; const d=draft(key, S.budget.find(x=>x.id===key)); if(t.type==='radio'){ if(t.checked) d.kind=t.value; } else d[t.dataset.pf]=t.value;
        const pv=f.querySelector('[data-preview]'); if(pv) pv.innerHTML = previewText(key, key==='global'?null:S.budget.find(x=>x.id===key)); }
      return;
    }
    if('restorefile' in t.dataset){
      const file = t.files && t.files[0]; t.value=''; if(!file) return;
      file.text().then(txt=>{ let body; try{ body=JSON.parse(txt); }catch(err){ status('That file is not a wedding budget backup'); return; }
        if(!body || !Array.isArray(body.budget)){ status('That file is not a wedding budget backup'); return; }
        if(confirm(`Replace everything in the budget with the backup from ${body.savedAt?new Date(body.savedAt).toLocaleDateString('en-GB'):'this file'}? Your current version is saved first, so you can undo this.`)) restoreFrom(body); });
      return;
    }
    if(menuChange(t)) return;
    const ed = t.closest('[data-row]');
    if(ed && t.dataset.f){
      const id = ed.dataset.row, f = t.dataset.f; let v;
      if(t.type==='checkbox') v = t.checked;
      else if('money' in t.dataset){ v = parseMoney(t.value); if(v===null && t.value.trim()!=='' ){ status('Enter a number, like 120.50'); return; } }
      else v = t.value;
      const r = S.budget.find(x=>x.id===id); if(r){ r[f]=v; }
      if(f==='category' && r){ const inCat=S.budget.filter(x=>x.category===v && x.id!==id); r.order = inCat.length? Math.max(...inCat.map(x=>n(x.order)))+0.01 : n(r.order); upd('budget/'+id,{category:v,order:r.order}); }
      else upd('budget/'+id,{[f]:v});
      if(t.type==='checkbox'){ pending=false; render(); } else pending=true;
      return;
    }
    const vr = t.closest('[data-venue]');
    if(vr && t.dataset.vf){
      const id=vr.dataset.venue, f=t.dataset.vf; let v;
      if(f==='include') v=t.checked; else if(f==='name') v=t.value; else { v=parseMoney(t.value); if(v===null){ status('Enter a number'); return; } }
      const it=S.venue.find(x=>x.id===id); if(it) it[f]=v;
      upd('venue/'+id,{[f]:v}); pending=true; if(f==='include') { pending=false; render(); } return;
    }
    if(t.dataset.setting){
      const v=parseMoney(t.value); if(v===null){ status('Enter a number'); return; }
      S.settings[t.dataset.setting]=v; upd('settings/main',{[t.dataset.setting]:v}); pending=true; return;
    }
    const sr = t.closest('[data-sav]');
    if(sr && t.dataset.sf){
      const id=sr.dataset.sav, f=t.dataset.sf; const v=parseMoney(t.value);
      if(v===null && t.value.trim()!==''){ status('Enter a number'); return; }
      const r=S.savings.find(x=>x.id===id); if(r) r[f]=v;
      upd('savings/'+id,{[f]:v}); pending=true; return;
    }
  });

  function newItemHtml(){
    const d = S.newItem;
    const f = (k, label, extra='') => `<label${extra}><span>${label}</span><input ${k==='date'?'type="date"':k==='name'||k==='who'?'type="text"':'inputmode="decimal"'} data-nf="${k}" value="${esc(d[k])}" ${k==='name'?'placeholder="For example: Envelopes"':k==='who'?'placeholder="MH"':k==='date'?'':'placeholder="0.00"'}></label>`;
    return `<div class="payform newitem" data-newitem>
      <h3>New item in ${esc(d.cat)}</h3>
      ${f('name','Item name',' class="span2"')}
      ${f('estimate','Expected cost (£)')}
      <p class="hint wide">Already spent something on it? Fill these in too. Leave them blank if not.</p>
      ${f('cost','Total cost (£)')}
      ${f('paid','Paid so far (£)')}
      ${f('date','Date paid')}
      ${f('who','Who paid')}
      <label><span>Paid with</span><select data-nf="source">${Object.entries(SOURCES).map(([k,v])=>`<option value="${k}" ${srcOf(d.source)===k?'selected':''}>${v}</option>`).join('')}</select></label>
      <div class="go"><span class="preview"></span><button class="btn ghost" data-newcancel>Cancel</button><button class="btn" data-newsave>Add item</button></div>
    </div>`;
  }
  function startNewItem(cat){
    S.newItem = {cat, name:'', estimate:'', cost:'', paid:'', date:today(), who:S.lastWho||'', source:'us'};
    S.open = null; S.globalPay = false;
    render();
    const el = view.querySelector('[data-newitem] [data-nf="name"]');
    if(el){ el.focus(); el.scrollIntoView({block:'center'}); }
  }
  function saveNewItem(){
    const d = S.newItem; if(!d) return;
    const form = view.querySelector('[data-newitem]');
    const focus = k => { const el = form && form.querySelector(`[data-nf="${k}"]`); if(el) el.focus(); };
    const name = (d.name||'').trim();
    if(!name){ status('Give the item a name'); focus('name'); return; }
    const bad = ['estimate','cost','paid'].find(k=>String(d[k]||'').trim()!=='' && parseMoney(d[k])===null);
    if(bad){ status('Enter a number, like 25.00'); focus(bad); return; }
    const estimate = parseMoney(d.estimate), paid = parseMoney(d.paid) || 0;
    let cost = parseMoney(d.cost);
    if(cost===null && paid>0) cost = paid;
    const cat = d.cat;
    const inCat = S.budget.filter(r=>r.category===cat);
    const ord = inCat.length ? Math.max(...inCat.map(r=>n(r.order)))+0.01 : Math.max(0,...S.budget.map(r=>n(r.order)))+1;
    const id = 'b'+Date.now();
    const who = (d.who||'').trim();
    const body = {category:cat,item:name,estimate,cost,paid,datePaid:paid>0?(d.date||''):'',who:paid>0?who:'',paidBack:false,balanceOverride:null,due:'',finalPaid:false,supplier:'',notes:'',order:ord,fundedBy:srcOf(d.source)};
    if(paid>0 && who) S.lastWho = who;
    S.budget.push({id, ...body});
    S.newItem = null;
    flashRow(id);
    setDoc('budget/'+id, body);
    status(`Added ${name} to ${cat}`);
  }
  function flashRow(id){
    const fr = S.budget.find(x=>x.id===id); if(fr) dropOpen('cat:'+(fr.category||'Other'), true);
    S.flash = id; render();
    const el = document.getElementById('row-'+id);
    if(el){ const st=document.getElementById('sticky'); const y=el.getBoundingClientRect().top+window.scrollY; const vis = el.getBoundingClientRect().top > st.offsetHeight && el.getBoundingClientRect().bottom < window.innerHeight; if(!vis) window.scrollTo({top:Math.max(y - st.offsetHeight - 80,0)}); }
    clearTimeout(flashRow.t); flashRow.t = setTimeout(()=>{ S.flash=null; const r=document.getElementById('row-'+id); if(r) r.classList.remove('flash'); }, 2500);
  }
  function addItem(cat){
    const inCat = S.budget.filter(r=>r.category===cat);
    const ord = inCat.length ? Math.max(...inCat.map(r=>n(r.order)))+0.01 : Math.max(0,...S.budget.map(r=>n(r.order)))+1;
    const id = 'b'+Date.now();
    S.open = id;
    setDoc('budget/'+id,{category:cat,item:'New item',estimate:null,cost:null,paid:0,datePaid:'',who:'',paidBack:false,balanceOverride:null,due:'',finalPaid:false,supplier:'',notes:'',order:ord});
  }
  function addVenueItem(sec){
    const inSec = S.venue.filter(v=>(v.section||'Other')===sec);
    const ord = inSec.length ? Math.max(...inSec.map(v=>n(v.order)))+0.01 : Math.max(0,...S.venue.map(v=>n(v.order)))+1;
    const id='v'+Date.now();
    dropOpen('venue:'+sec, true);
    S.venue.push({id,name:'New item',price:0,qty:1,include:true,order:ord,section:sec});
    render();
    setDoc('venue/'+id,{name:'New item',price:0,qty:1,include:true,order:ord,section:sec});
    const el = view.querySelector(`[data-venue="${CSS.escape(id)}"] [data-vf="name"]`); if(el){ el.focus(); el.select(); }
  }
  function addMonth(){
    const rows=[...S.savings].sort((a,b)=>n(a.order)-n(b.order)); const last=rows[rows.length-1];
    let y=2026,m=1; if(last && last.month){ [y,m]=last.month.split('-').map(Number); m++; if(m>12){m=1;y++;} }
    const label = new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'short'})+' '+String(y).slice(2);
    const id = 'm'+y+String(m).padStart(2,'0');
    setDoc('savings/'+id,{month:`${y}-${String(m).padStart(2,'0')}`,label,p1:null,p2:null,gifts:null,idealP1:null,idealP2:null,order:(last?n(last.order):0)+1});
  }

  const stickyEl = document.getElementById('sticky');
  const onScroll = () => stickyEl.classList.toggle('stuck', stickyEl.getBoundingClientRect().top <= 0.5 && window.scrollY > 0);
  window.addEventListener('scroll', onScroll, {passive:true});

  /* ---------- boot ---------- */
  render();
  (async ()=>{
    try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
    try{ downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ downloads=null; }
    if(!db){ render(); return; }
    const err = e => { if(e && e.code==='revoked'){ db=null; render(); } };
    const col = (name, key) => db.collection(name).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); S.ready[key]=true; schedule(); }, err);
    col('budget','budget'); col('venue','venue'); col('savings','savings');
    let snapDone=false;
    const trySnap = () => { if(snapDone) return; if(['budget','venue','savings','settings','menu'].every(k=>S.ready[k])){ snapDone=true; setTimeout(dailySnapshot, 1500); } else setTimeout(trySnap, 800); };
    setTimeout(trySnap, 800);
    db.doc('settings/main').onSnapshot(s=>{ S.settings = s.exists ? {...s.data()} : {minSpend:0,servicePct:0,goalEach:0}; S.ready.settings=true; schedule(); }, err);
    let got=0;
    const menuDone=()=>{ if(++got>=2){ S.ready.menu=true; } schedule(); };
    let a=false,b=false;
    db.doc('menu/sets').onSnapshot(s=>{ S.menuSets = s.exists?s.data():null; if(!a){a=true;menuDone();} else schedule(); }, err);
    db.doc('menu/canapes').onSnapshot(s=>{ S.canapes = s.exists?s.data():null; if(!b){b=true;menuDone();} else schedule(); }, err);
  })();
})();
</script>
</body>
</html>
