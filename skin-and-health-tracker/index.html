<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skin and health tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7ECEE; --panel:#FFFFFF; --ink:#2A1A2D; --muted:#7B6780; --line:#EAD7DC;
  --red:#D6304C; --redsoft:#F9D9DF; --blue:#3569DB; --bluesoft:#DCE6FB;
  --sage:#5E9474; --sagesoft:#DDEDE2; --amber:#C98613; --ambersoft:#FBEBCB;
  --plum:#8A3F8F; --plumsoft:#F1DDF1; --brown:#8A5A2B; --brownsoft:#F1E3D3;
  --bead-off:#EFDDE2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1220; --panel:#261A2C; --ink:#F5E9EF; --muted:#B39DB8; --line:#3A2A41;
    --red:#FF5873; --redsoft:#4A1E2A; --blue:#7FA2FF; --bluesoft:#1F2A4A;
    --sage:#86C29E; --sagesoft:#1E3328; --amber:#F2B347; --ambersoft:#3D2E12;
    --plum:#D98ADF; --plumsoft:#3B2140; --brown:#D9A36B; --brownsoft:#3A2A1C;
    --bead-off:#3A2A41;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1220; --panel:#261A2C; --ink:#F5E9EF; --muted:#B39DB8; --line:#3A2A41;
  --red:#FF5873; --redsoft:#4A1E2A; --blue:#7FA2FF; --bluesoft:#1F2A4A;
  --sage:#86C29E; --sagesoft:#1E3328; --amber:#F2B347; --ambersoft:#3D2E12;
  --plum:#D98ADF; --plumsoft:#3B2140; --brown:#D9A36B; --brownsoft:#3A2A1C;
  --bead-off:#3A2A41;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:18px 18px 64px}
h1,h2,h3{font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,38px)}
h2{font-size:22px;margin-bottom:12px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input[type=date]{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 8px}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 10px;margin:0 -18px 14px;padding-left:18px;padding-right:18px;overflow-x:auto}
.tabs-in{display:flex;gap:6px;min-width:max-content}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 16px}
.sync{font-size:13px;color:var(--muted)}
.view{display:none}.view.on{display:block}

.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:6px 11px}
.btn.danger{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 10px}

/* Dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.dcard{text-align:left;border:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc)}
.dcard .dt{font-weight:700;font-size:14px;color:var(--acc);display:flex;gap:6px;align-items:center}
.dcard .big{font-family:"Young Serif",Georgia,serif;font-size:24px;line-height:1.2}
.dcard .go{margin-top:auto;font-size:13px;color:var(--muted);font-weight:600}

/* Mask hero */
.mode-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.mode-ageing{background:var(--redsoft);color:var(--red)}
.mode-blemish{background:var(--bluesoft);color:var(--blue)}
.mode-sustain{background:var(--sagesoft);color:var(--sage)}
.mask-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:8px;margin:14px 0 4px}
.count b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:64px;line-height:1}
.beads{display:grid;grid-template-columns:repeat(14,1fr);gap:7px;margin:18px 0 8px}
.bead{aspect-ratio:1;border-radius:50%;background:var(--bead-off);transition:background .3s,box-shadow .3s}
.bead.on{background:var(--beadc);box-shadow:0 0 8px 1px var(--beadglow)}
.week-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:12px;color:var(--muted);margin-bottom:14px}
.note{border-radius:16px;padding:12px 14px;font-size:15px;margin-top:10px}
.note-red{background:var(--redsoft)} .note-blue{background:var(--bluesoft)} .note-sage{background:var(--sagesoft)} .note-amber{background:var(--ambersoft)} .note-plum{background:var(--plumsoft)}

/* Week strip */
.strip-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 4px 9px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .dn{font-size:12px;color:var(--muted);font-weight:600}
.day .dd{font-family:"Young Serif",Georgia,serif;font-size:19px;line-height:1}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 6px;white-space:nowrap}
.day .ticks{display:flex;gap:3px;height:6px}
.day .ticks i{width:6px;height:6px;border-radius:50%;background:var(--bead-off)}
.day .ticks i.on{background:var(--sage)} .day .ticks i.miss{background:var(--red)}
.day.sel{border-color:var(--ink);border-width:2px;padding:9px 3px 8px}
.day.is-today .dn{color:var(--ink)}
.t-B{background:var(--ambersoft);color:var(--amber)}
.t-A{background:var(--bluesoft);color:var(--blue)}
.t-L{background:var(--redsoft);color:var(--red)}
.t-C{background:var(--sagesoft);color:var(--sage)}

.plan-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.section-label{font-weight:700;font-size:15px;margin:18px 0 8px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:1px}
ol.steps li.hl::before{background:var(--ink);color:var(--bg)}
.step-name{font-weight:600}
.step-why{font-size:14px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--panel);text-align:left;font-weight:600;font-size:14px}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--sagesoft);border-color:var(--sage)}
.check.on .box{background:var(--sage);border-color:var(--sage)}
.check.on .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.miss.on{background:var(--redsoft);border-color:var(--red)}
.check.miss.on .box{background:var(--red);border-color:var(--red)}
.check.miss.on .box::after{content:"✕";border:0;transform:none;width:auto;height:auto;color:#fff;font-size:13px;font-weight:700}
.water{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.drop{width:26px;height:30px;border:0;background:none;padding:0}
.drop svg{width:100%;height:100%} .drop path{fill:var(--bead-off);transition:fill .2s} .drop.on path{fill:var(--blue)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--dot);margin-top:5px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:5px;top:20px;bottom:0;width:2px;background:var(--line)}
.when{font-size:14px;color:var(--muted)}
details{border-top:1px solid var(--line);padding:12px 0} details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
.acc{padding:4px 20px}
.acc details{padding:0}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0;font-size:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:6px;transition:transform .2s;flex:none}
.acc details[open] summary::after{transform:rotate(-135deg)}
.acc summary .sm{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.acc details > :not(summary){margin-bottom:16px}

/* Date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.datebar .lbl{font-family:"Young Serif",Georgia,serif;font-size:22px;text-align:center;flex:1}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:700}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);color:#fff}
.chip[aria-pressed="true"]::before{background:#fff}

/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;padding:2px;min-width:0}
.cell.blank{background:none}
.cell.today{border-color:var(--ink)}
.cell.sel{border:2px solid var(--blue)}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cell.period{background:var(--red);color:#fff;font-weight:700}
.cell.predict{background:var(--redsoft);border:1.5px dashed var(--red)}
.cell .num{font-size:10px;font-weight:700;color:var(--brown)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:4px}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}
.big-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bigb{border:0;border-radius:18px;padding:16px;font-weight:700;font-size:16px;color:#fff;background:var(--c)}
.empty{color:var(--muted);font-size:15px}

/* Home gym + quick ticks */
.gt-card{padding-top:14px;padding-bottom:10px}
.gt-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.gt-d{width:74px;flex:none;font-size:14px}
.gt-row .up-w{flex:1;min-width:0}
.pb-btn.sm{padding:5px 12px;font-size:12px}
.gt-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
.gt-state{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bluesoft);color:var(--blue)}
.gt-state.done{background:var(--sagesoft);color:var(--sage)}
.gt-none{font-family:"Young Serif",Georgia,serif;font-size:19px}
.gt-acts{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.gt-link{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:4px 0}
.gt-up{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.gt-up .up-row{padding:7px 0}
.qt-row{display:flex;flex-wrap:wrap;gap:8px}
.qt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px 7px 8px;font-weight:600;font-size:13px}
.qt .tb-box{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none;display:grid;place-items:center}
.qt.on{background:var(--sagesoft);border-color:transparent;color:var(--muted)}
.qt.on .tb-box{background:var(--sage);border-color:var(--sage)}
.qt.on .tb-box::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* Gym planning */
.cell .dots i.ring{background:transparent;border:1.5px solid var(--c);width:7px;height:7px;box-sizing:border-box}
.cell.future{background:transparent;border:1px dashed var(--line)}
.cell.future.sel{border:2px solid var(--blue)}
.plan-note{font-size:13px;color:var(--muted);margin:0 0 8px;text-align:center}
.plan-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--bluesoft)}
.plan-bar .pb-t{flex:1;min-width:0;font-size:14px}
.pb-btn{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;background:var(--blue);color:#fff}
.up-list{list-style:none;margin:8px 0 0;padding:0}
.up-list li{border-top:1px solid var(--line)}
.up-list li:first-child{border-top:0}
.up-row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 0;border:0;background:none;color:var(--ink);text-align:left}
.up-day{width:52px;flex:none;line-height:1.15}
.up-day b{display:block;font-size:15px}
.up-day span{font-size:12px;color:var(--muted)}
.up-w{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.up-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid var(--c)}
.up-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
/* Sticky gym logger */
.sticky-log{position:sticky;top:var(--tabsH,62px);z-index:4;padding:12px 14px;box-shadow:0 8px 20px -12px rgba(42,26,45,.35)}
.sticky-log .datebar{margin-bottom:10px}
.sticky-log .datebar .lbl{font-size:18px}
.sticky-log .arrow{width:34px;height:34px;font-size:16px}
.sticky-log .chip{padding:6px 11px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.wk-list{list-style:none;margin:10px 0 0;padding:0}
.wk-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.wk-list li:first-child{border-top:0}
.wk-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);flex:none}
.wk-list li.on .wk-dot{background:var(--c)}
.wk-n{flex:1;font-weight:600}
.wk-list li:not(.on) .wk-n{color:var(--muted)}
.gopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.gopt{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.gopt b{font-size:14px}
.gopt span{font-size:12px;color:var(--muted)}
.gopt[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.ins{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;border-left:6px solid var(--acc)}
.ins.lv-good{background:var(--soft);border-color:transparent;border-left-color:var(--acc)}
.ins.lv-empty{opacity:.7}
.ins-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;font-weight:700}
.ins-area{color:var(--acc)}
.ins-lv{color:var(--muted)}
.lv-watch .ins-lv{color:var(--red)}
.ins-tips{margin:10px 0 0;padding-left:18px;font-size:14px}
.ins-tips li{margin-bottom:4px}
/* New home */
.hero{background:var(--ink);color:var(--bg);border-radius:32px;padding:26px 22px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .hi{font-family:"Young Serif",Georgia,serif;font-size:clamp(30px,7vw,42px);line-height:1.1}
.hero .date{opacity:.7;margin-top:4px}
.hero .tonight{margin-top:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .tn-label{font-size:13px;opacity:.7;font-weight:600}
.hero .tn-big{font-family:"Young Serif",Georgia,serif;font-size:24px}
.hero .ring{width:74px;height:74px;flex:none}
.hero .ring circle{fill:none;stroke-width:8}
.hero .ring .bg{stroke:rgba(255,255,255,.14)}
:root[data-theme="dark"] .hero .ring .bg{stroke:rgba(0,0,0,.14)}
.hero .ring .fg{stroke:var(--red);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.hero .ring text{fill:currentColor;font-family:"Young Serif",Georgia,serif;font-size:20px}
.hero .minibeads{display:grid;grid-template-columns:repeat(28,1fr);gap:4px;margin-top:18px}
.hero .minibeads span{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .minibeads span.on{background:var(--beadc);box-shadow:0 0 6px var(--beadc)}
.hero .mb-cap{font-size:13px;opacity:.75;margin-top:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .ring .bg,:root:not([data-theme="light"]) .hero .minibeads span:not(.on){background:rgba(0,0,0,.12);stroke:rgba(0,0,0,.14)}}
.todo-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo-item{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;text-align:left;font-weight:600;font-size:15px}
.todo-item .tb-box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none;display:grid;place-items:center}
.todo-item.on{background:var(--sagesoft);border-color:transparent}
.todo-item.on span:last-child{text-decoration:line-through;color:var(--muted)}
.todo-item.on .tb-box{background:var(--sage);border-color:var(--sage)}
.todo-item.on .tb-box::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.alert{display:flex;align-items:center;gap:12px;border-radius:20px;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap}
.al-plum{background:var(--plumsoft)} .al-sage{background:var(--sagesoft)}
.al-ic{font-size:24px}
.alert > div{flex:1;min-width:160px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gutrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.gut-e{display:flex;gap:4px}
.gbtn{border:0;background:var(--panel);font-size:22px;line-height:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0}
.gbtn:hover{background:var(--bg)}
.gutbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;background:var(--ambersoft);border-radius:16px;padding:10px 12px}
.gut-l{font-weight:700;font-size:14px;color:var(--amber)}
.gut-e{display:flex;gap:6px}
.qbtn{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.qbtn .qe{font-size:22px;line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;border-radius:26px;padding:16px;background:var(--soft);color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:168px}
.tile .ic{width:38px;height:38px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:19px;margin-bottom:6px}
.tile .tl{font-size:13px;font-weight:700;color:var(--acc)}
.tile .tb{font-family:"Young Serif",Georgia,serif;font-size:20px;line-height:1.2}
.tile .ts{font-size:13px;color:var(--muted)}
.tile .viz{margin-top:auto;padding-top:10px;display:flex;gap:4px;align-items:flex-end}
.tile .viz i{flex:1;height:8px;border-radius:4px;background:var(--panel)}
.tile .viz i.on{background:var(--acc)}
.tile .viz .vd{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.tile .viz .vd i{width:100%;flex:none}
.tile .viz .vd b{font-size:10px;font-weight:600;color:var(--muted)}
.tile .viz .vt b{color:var(--ink);font-weight:800}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
@media (max-width:420px){.tag{font-size:10px;padding:2px 4px}.beads{gap:5px}.cell{border-radius:9px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* Standalone storage: when this page runs outside claude.ai, everything is saved
   in this browser's localStorage. Nothing is sent anywhere. */
(function(){
  if (window.claude && window.claude.use) return;
  var KEY = 'app-data:' + location.pathname;
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  var listeners = [];
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function clone(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function norm(p){ return String(p).replace(/^\/+|\/+$/g, ''); }
  function notify(){ setTimeout(function(){ listeners.slice().forEach(function(l){ try { l(); } catch (e) {} }); }, 0); }
  function docSnap(path){
    var has = Object.prototype.hasOwnProperty.call(store, path);
    var id = path.split('/').pop();
    return { id: id, exists: has, metadata: { hasPendingWrites: false },
      data: function(){ return has ? clone(store[path]) : undefined; }, ref: docRef(path) };
  }
  function docRef(p){
    var path = norm(p);
    return {
      id: path.split('/').pop(), path: path,
      get: function(){ return Promise.resolve(docSnap(path)); },
      set: function(d){ store[path] = clone(d) || {}; persist(); notify(); return Promise.resolve(); },
      update: function(patch){ store[path] = Object.assign({}, store[path] || {}, clone(patch)); persist(); notify(); return Promise.resolve(); },
      delete: function(){ delete store[path]; persist(); notify(); return Promise.resolve(); },
      onSnapshot: function(cb){
        var last = null;
        var fire = function(){ var s = JSON.stringify(store[path]); if (s === last) return; last = s; cb(docSnap(path)); };
        listeners.push(fire); setTimeout(fire, 0);
        return function(){ listeners = listeners.filter(function(x){ return x !== fire; }); };
      }
    };
  }
  function colSnap(path){
    var pre = path + '/';
    var docs = Object.keys(store).filter(function(k){ return k.indexOf(pre) === 0 && k.slice(pre.length).indexOf('/') < 0; })
      .sort().map(function(k){ return docSnap(k); });
    return { docs: docs, size: docs.length, empty: !docs.length, forEach: function(f){ docs.forEach(f); } };
  }
  function colRef(p){
    var path = norm(p);
    return {
      path: path,
      doc: function(id){ return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      get: function(){ return Promise.resolve(colSnap(path)); },
      onSnapshot: function(cb){
        var last = null;
        var fire = function(){ var s = colSnap(path); var sig = JSON.stringify(s.docs.map(function(d){ return [d.id, store[path + '/' + d.id]]; })); if (sig === last) return; last = sig; cb(s); };
        listeners.push(fire); setTimeout(fire, 0);
        return function(){ listeners = listeners.filter(function(x){ return x !== fire; }); };
      }
    };
  }
  var db = { doc: docRef, collection: colRef };
  var user = { id: function(){ return Promise.resolve('local'); } };
  var downloads = { save: function(o){
    var blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: o.mimeType || 'application/octet-stream' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename || 'download';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return Promise.resolve();
  } };
  window.claude = { use: function(name){
    if (name === 'db') return Promise.resolve(db);
    if (name === 'user') return Promise.resolve(user);
    if (name === 'downloads') return Promise.resolve(downloads);
    return Promise.resolve(null);
  } };
})();
</script>
<script>
(function(){
"use strict";
var COURSE_LEN = 56, DOC_ID = "skin-state", LS_KEY = "skin-tracker-v1";

var MODES = {
  ageing:  {name:"Anti-ageing",  mins:10, cls:"mode-ageing",  c:"var(--red)",  glow:"rgba(214,48,76,.45)"},
  blemish: {name:"Clear skin", mins:10, cls:"mode-blemish", c:"var(--blue)", glow:"rgba(53,105,219,.45)"},
  sustain: {name:"Maintenance",   mins:5, cls:"mode-sustain", c:"var(--sage)", glow:"rgba(94,148,116,.45)"}
};
var NIGHT = {0:"B",1:"A",2:"C",3:"L",4:"C",5:"B",6:"A"};
var LACTIC_DAY = 3; // Wednesday
function lastLactic(upto){var best=null;Object.keys(state.log).forEach(function(k){if(state.log[k].lactic&&k<=upto&&(!best||k>best))best=k;});return best;}
function lacticDue(){
  var last=lastLactic(TODAY);
  if(!last) { var d=new Date(today); while(d.getDay()!==LACTIC_DAY) d=addDays(d,1); return key(d); }
  var n=addDays(fromKey(last),5); while(n.getDay()!==LACTIC_DAY) n=addDays(n,1);
  var nk=key(n); return nk<TODAY?TODAY:nk;
}
function isLactic(k){
  if(state.log[k]&&state.log[k].lactic) return true;
  if(k<TODAY) return false;
  return k===lacticDue();
}
function nightType(d){
  var k=key(d);
  if(isLactic(k)) return "L";
  var b=NIGHT[d.getDay()];
  if(b==="L") return "C";
  if(isLactic(key(addDays(d,-1)))) return "C";
  return b;
}
var NIGHT_INFO = {
  A:{short:"Salicylic", title:"Salicylic night", why:"Clears congestion and under-skin bumps", active:null},
  B:{short:"Retinol", title:"Retinol night", why:"Cell turnover and smoother texture", active:null},
  C:{short:"Plain", title:"Plain night", why:"No actives, just hydration and recovery", active:null},
  L:{short:"Lactic", title:"Lactic acid night", why:"Gentle exfoliant, brightens and smooths", active:"Lactic acid"}
};
var EYE_DAY = 6, TOPUP_DAY = 6;
var GYM = [
  {id:"push",   name:"Push",       c:"#E0476B"},
  {id:"legs",   name:"Legs", c:"#E8912D"},
  {id:"pull",   name:"Pull",             c:"#3F7BE0"},
  {id:"cardio", name:"Cardio",      c:"#15A39C"},
  {id:"core",   name:"Core",     c:"#9A5BD8"},
  {id:"yoga",   name:"Yoga",              c:"#E65FB4"},
  {id:"extra",  name:"Extra",            c:"#7F8F2A"}
];
var REST_C = "#9C8FA0";
var QUICK = [
  {id:"good", name:"Good", emoji:"😄", c:"#4FA36B", hint:""},
  {id:"meh",  name:"Okay", emoji:"😐", c:"#D9A63A", hint:""},
  {id:"bad",  name:"Bad",    emoji:"😖", c:"#D6485E", hint:""}
];
var AMT=[{id:"small",name:"Barely anything"},{id:"med",name:"Normal amount"},{id:"big",name:"Loads"}];
function amtName(id){var a=AMT.filter(function(x){return x.id===id;})[0];return a?a.name:"";}
function pooType(id){return POO.concat(QUICK).filter(function(q){return q.id===id;})[0]||POO[1];}
var POO = [
  {id:"hard",   name:"Hard",   c:"#8A5A2B", hint:"Lumpy or hard to pass"},
  {id:"normal", name:"Normal", c:"#5E9474", hint:"Smooth and easy"},
  {id:"loose",  name:"Loose",  c:"#D29A2A", hint:"Soft or runny"}
];
var TABS = [["home","🏠","Home"],["skin","✨","Skin"],["gym","💪","Gym"],["period","🩸","Period"],["poo","🌿","Gut"],["insights","💡","Insights"]];

function pad(n){return n<10?"0"+n:""+n}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fromKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function diff(a,b){return Math.round((fromKey(b)-fromKey(a))/864e5)}
function fmt(d,o){return d.toLocaleDateString("en-GB",o||{weekday:"long",day:"numeric",month:"long"})}
function short(d){return fmt(d,d.getFullYear()!==new Date().getFullYear()?{weekday:"short",day:"numeric",month:"short",year:"numeric"}:{weekday:"short",day:"numeric",month:"short"})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var today=new Date();today.setHours(0,0,0,0);var TODAY=key(today);

function seed(){return {v:1,mode:"ageing",done:0,log:{},history:[],seeded:TODAY,lacticSeeded:true};}
function migrate(s){
  if(!s) s=seed();
  if(s.v===1){s.v=2;}
  s.gym=s.gym||{}; s.gymPlan=s.gymPlan||{}; s.gutq=s.gutq||{}; s.periods=s.periods||[]; s.poo=s.poo||{}; s.log=s.log||{}; s.history=s.history||[];
  if(!s.courseStart) s.courseStart = key(addDays(today,-(s.done||0)+1));
  if(false){ var tu=new Date(today); while(tu.getDay()!==3) tu=addDays(tu,-1); var tk=key(tu); s.log[tk]=Object.assign({},s.log[tk]||{},{lactic:true}); s.lacticSeeded=true; }
  return s;
}
var state=null;
try{var raw=localStorage.getItem(LS_KEY);if(raw)state=JSON.parse(raw);}catch(e){}
state=migrate(state);

var ui={tab:"home", sel:TODAY, weekOff:0, cal:{gym:null,period:null,poo:null}};
(function(){var m=new Date(today.getFullYear(),today.getMonth(),1);ui.cal.gym=new Date(m);ui.cal.period=new Date(m);ui.cal.poo=new Date(m);})();
var docRef=null, saveTimer=null;

function toast(msg){var el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;el.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){el.className="";},2200);}
function setSync(t){document.getElementById("sync").textContent=t;}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  if(!docRef)return;
  clearTimeout(saveTimer);setSync("Saving…");
  saveTimer=setTimeout(function(){
    docRef.set(JSON.parse(JSON.stringify(state))).then(function(){setSync("Saved");}).catch(function(){setSync("Saved on this device");});
  },500);
}

/* ---------- Skin helpers ---------- */
function entry(k){return state.log[k]||{};}
function setEntry(k,patch){
  var e=Object.assign({},entry(k),patch);
  Object.keys(e).forEach(function(p){if(e[p]===false||e[p]===null||e[p]===0)delete e[p];});
  if(Object.keys(e).length)state.log[k]=e;else delete state.log[k];
}
function isTopup(d){return state.mode==="blemish"&&d.getDay()===TOPUP_DAY;}
function ledModeFor(d){return isTopup(d)?"ageing":state.mode;}
function remaining(){return Math.max(0,COURSE_LEN-state.done);}
function tonightDone(){var e=entry(TODAY);return !!e.led;}
function finishDate(){
  var n=remaining(); if(!n)return null;
  var d=addDays(today, tonightDone()?1:0);
  for(var guard=0;guard<400;guard++){
    if(!(state.mode==="blemish"&&d.getDay()===TOPUP_DAY)){n--; if(n===0)return d;}
    d=addDays(d,1);
  }
  return d;
}
function missedThisCourse(){
  var n=0;Object.keys(state.log).forEach(function(k){if(k>=state.courseStart&&state.log[k].missed)n++;});return n;
}

/* ---------- Period helpers ---------- */
function periodsSorted(){return state.periods.slice().sort(function(a,b){return a.s<b.s?-1:1;});}
function ongoing(){var p=periodsSorted();var last=p[p.length-1];return last&&!last.e?last:null;}
function isPeriodDay(k){
  return state.periods.some(function(p){var end=p.e||(k<=TODAY?TODAY:p.s);return k>=p.s&&k<=end;});
}
function cycleInfo(){
  var p=periodsSorted(), lens=[], plens=[];
  for(var i=1;i<p.length;i++)lens.push(diff(p[i-1].s,p[i].s));
  p.forEach(function(x){if(x.e)plens.push(diff(x.s,x.e)+1);});
  var recent=lens.slice(-6);
  var avg=recent.length?Math.round(recent.reduce(function(a,b){return a+b},0)/recent.length):null;
  var mn=recent.length?Math.min.apply(null,recent):null, mx=recent.length?Math.max.apply(null,recent):null;
  var pavg=plens.length?Math.round(plens.slice(-6).reduce(function(a,b){return a+b},0)/Math.min(6,plens.length)):null;
  var last=p[p.length-1], win=null;
  if(last&&recent.length){
    var lo=mn,hi=mx; if(lo===hi){lo-=2;hi+=2;}
    win={from:addDays(fromKey(last.s),lo),to:addDays(fromKey(last.s),hi)};
  }
  return {lens:lens,avg:avg,min:mn,max:mx,pavg:pavg,last:last,win:win,count:p.length};
}
function inPredict(k){
  var c=cycleInfo(); if(!c.win||ongoing())return false;
  return k>=key(c.win.from)&&k<=key(c.win.to)&&k>=TODAY;
}

/* ---------- Common render bits ---------- */
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'"><span aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
  TABS.forEach(function(t){document.getElementById("v-"+t[0]).classList.toggle("on",ui.tab===t[0]);});
  var titles={home:"Today",skin:"Skin",gym:"Gym",period:"Period",poo:"Gut health",insights:"Insights"};
  document.getElementById("pageTitle").textContent=titles[ui.tab];
}
function dateBar(){
  var d=fromKey(ui.sel);
  var lbl=ui.sel===TODAY?"Today":(ui.sel===key(addDays(today,-1))?"Yesterday":(ui.sel===key(addDays(today,1))?"Tomorrow":short(d)));
  var fwd=ui.tab==="gym"&&ui.sel<key(addDays(today,90));
  return '<div class="datebar"><button class="arrow" data-nav="-1" aria-label="Previous day">‹</button><div class="lbl">'+lbl+'</div><button class="arrow" data-nav="1" aria-label="Next day"'+((ui.sel>=TODAY&&!fwd)?' disabled style="opacity:.35"':'')+'>›</button></div>';
}
function calendar(which, cellFn, legend, allowFuture){
  var m=ui.cal[which], y=m.getFullYear(), mo=m.getMonth();
  var first=new Date(y,mo,1), offset=(first.getDay()+6)%7, days=new Date(y,mo+1,0).getDate();
  var h='<div class="cal-head"><button class="arrow" data-cal="'+which+'" data-dir="-1" aria-label="Previous month">‹</button><h3 style="font-size:18px">'+fmt(first,{month:"long",year:"numeric"})+'</h3><button class="arrow" data-cal="'+which+'" data-dir="1" aria-label="Next month">›</button></div><div class="cal">';
  ["M","T","W","T","F","S","S"].forEach(function(w){h+='<div class="wd">'+w+'</div>';});
  for(var i=0;i<offset;i++)h+='<div class="cell blank"></div>';
  for(var dd=1;dd<=days;dd++){
    var k=key(new Date(y,mo,dd)), r=cellFn(k)||{};
    var cls="cell"+(k===TODAY?" today":"")+(allowFuture&&k>TODAY?" future":"")+(k===ui.sel?" sel":"")+(r.cls?" "+r.cls:"");
    var dots=r.dots&&r.dots.length?'<span class="dots">'+r.dots.map(function(c){var ring=c.charAt(0)==="o";return '<i'+(ring?' class="ring"':'')+' style="--c:'+(ring?c.slice(1):c)+'"></i>';}).join("")+'</span>':"";
    h+='<button class="'+cls+'" data-pick="'+k+'"'+((k>TODAY&&!allowFuture)?' disabled':'')+' aria-label="'+fmt(fromKey(k))+'"><span>'+dd+'</span>'+dots+(r.extra||"")+'</button>';
  }
  h+='</div>';
  if(legend)h+='<div class="legend"><span style="font-weight:700">Colour key:</span>'+legend.map(function(l){return '<span><i style="--c:'+l[1]+'"></i>'+l[0]+'</span>';}).join("")+'</div>';
  return h;
}

/* ---------- Home ---------- */
function greeting(){var h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}
function renderHome(){
  var t=nightType(today), e=entry(TODAY), info=NIGHT_INFO[t], m=MODES[ledModeFor(today)];
  var parts=[e.am,e.pm,e.led]; if(info.active) parts.push(e.active); if(today.getDay()===EYE_DAY) parts.push(e.eye);
  var doneN=parts.filter(Boolean).length, totalN=parts.length, C=2*Math.PI*30, off=C*(1-doneN/totalN);
  var tonightTxt=info.title+(today.getDay()===EYE_DAY?" + eye mask":"");
  var maskTxt=isTopup(today)?"Anti-ageing top-up tonight":(state.mode==="sustain"?"Maintenance mode":m.name+" · day "+Math.min(COURSE_LEN,state.done+(e.led?0:1))+" of "+COURSE_LEN);
  var gToday=state.gym[TODAY], gymLogged=!!(gToday&&(gToday.rest||(gToday.w&&gToday.w.length)));
  var todo=[
    {p:"am",label:"Morning skincare",on:e.am},
    {p:"pm",label:"Evening skincare",on:e.pm},
    {p:"led",label:"LED mask",on:e.led}
  ];
  if(t==="L") todo.push({p:"lactic",label:"Lactic acid",on:e.lactic});
  if(today.getDay()===EYE_DAY) todo.push({p:"eye",label:"Under-eye mask",on:e.eye});
  var tdone=todo.filter(function(x){return x.on;}).length;
  // Alerts: period
  var alerts="", onP=ongoing(), ci=cycleInfo();
  if(onP){
    alerts+='<div class="alert al-plum"><span class="al-ic">🩸</span><div><b>Period ongoing</b><div class="small">Day '+(diff(onP.s,TODAY)+1)+', started '+short(fromKey(onP.s))+'</div></div><button class="btn small" data-per="end">Ended today</button></div>';
  } else if(ci.win){
    var wf=key(ci.win.from), wt=key(ci.win.to), wk7=key(addDays(today,7));
    if(wt<TODAY) alerts+='<div class="alert al-plum"><span class="al-ic">🩸</span><div><b>Period later than usual</b><div class="small">Your usual window ended '+short(ci.win.to)+'</div></div><button class="btn small" data-per="start">Started today</button></div>';
    else if(wf<=wk7) alerts+='<div class="alert al-plum"><span class="al-ic">🩸</span><div><b>'+(wf<=TODAY?"Period could start any day":"Period could start this week")+'</b><div class="small">Expected '+short(ci.win.from)+' to '+short(ci.win.to)+'</div></div><button class="btn small" data-per="start">Started today</button></div>';
  }
  // Quick gut check, twice a day
  var slot=new Date().getHours()<15?"am":"pm", gq=(state.gutq||{})[TODAY]||{};

  }
  if(ds.pdel!==undefined){
    if(ui.pendingDel===ds.pdel){ui.pendingDel=null;state.periods.splice(+ds.pdel,1);save();renderAll();toast("Period deleted");}
    else{ui.pendingDel=ds.pdel;renderAll();}
    return;}

  if(ds.gc){ui.gutDraft=Object.assign({},ui.gutDraft||{},{type:ds.gc});renderAll();return;}
  if(ds.ga){ui.gutDraft=Object.assign({},ui.gutDraft||{},{amt:ds.ga});renderAll();return;}
  if(ds.gutlog){var dr2=ui.gutDraft||{};if(!dr2.type||!dr2.amt)return;var lg=(state.poo[ui.sel]||[]).slice();lg.push({type:dr2.type,amt:dr2.amt,t:ui.sel===TODAY?nowTime():null});state.poo[ui.sel]=lg;ui.gutDraft=null;save();renderAll();toast("Logged");return;}
  if(ds.poo){var l=(state.poo[ui.sel]||[]).slice();l.push({type:ds.poo,t:ui.sel===TODAY?nowTime():null});state.poo[ui.sel]=l;save();renderAll();return;}
  if(ds.poodel!==undefined){var l2=(state.poo[ui.sel]||[]).slice();l2.splice(+ds.poodel,1);if(l2.length)state.poo[ui.sel]=l2;else delete state.poo[ui.sel];save();renderAll();return;}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="modeSel"){var to=t.value;ui.pendingMode=(to===state.mode)?null:to;renderAll();return;}
  if(t.dataset&&t.dataset.pedit!==undefined){
    var p=state.periods[+t.dataset.pedit];if(!p)return;
    if(t.dataset.f==="s"){if(!t.value){renderAll();return;}p.s=t.value;if(p.e&&p.e<p.s)p.e=p.s;}
    else{if(t.value&&t.value<p.s){toast("The end date is before the start date");renderAll();return;}if(t.value)p.e=t.value;else delete p.e;}
    save();renderAll();
  }
});

function setTabsH(){var t=document.querySelector(".tabs");if(t)document.documentElement.style.setProperty("--tabsH",t.offsetHeight+"px");}
window.addEventListener("resize",setTabsH);
renderAll();setTabsH();

(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    var r=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    var db=r[0],user=r[1];if(!db||!user)return;
    var uid=await user.id();if(!uid)return;
    docRef=db.doc("data/users/"+uid+"/"+DOC_ID);
    var snap=await docRef.get();
    if(snap.exists){
      var remote=snap.data();
      if(remote&&(remote.v===1||remote.v===2)){state=migrate(JSON.parse(JSON.stringify(remote)));try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
        if(remote.v!==2)docRef.set(JSON.parse(JSON.stringify(state))).catch(function(){});
        renderAll();}
    } else await docRef.set(JSON.parse(JSON.stringify(state)));
    setSync("Saved");
  }catch(e){docRef=null;setSync("Saved on this device");}
})();
})();
</script>
